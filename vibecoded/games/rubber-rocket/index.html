class VirtualJoystick {
    constructor(baseX, baseY, radius) {
        this.baseX = baseX;
        this.baseY = baseY;
        this.radius = radius;
        this.touchId = null;
        this.active = false;
        this.dx = 0;
        this.dy = 0;
        this.magnitude = 0;
    }
    handleStart(touch) {
        if (this.active) return false;
        let d = Math.hypot(touch.clientX - this.baseX, touch.clientY - this.baseY);
        if (d < this.radius * 2.5) {
            this.active = true;
            this.touchId = touch.identifier;
            this.handleMove(touch);
            return true;
        }
        return false;
    }
    handleMove(touch) {
        if (touch.identifier !== this.touchId) return;
        let maxDist = this.radius;
        let rawDx = touch.clientX - this.baseX;
        let rawDy = touch.clientY - this.baseY;
        let rawMag = Math.hypot(rawDx, rawDy);
        if (rawMag > maxDist) {
            rawDx = (rawDx / rawMag) * maxDist;
            rawDy = (rawDy / rawMag) * maxDist;
            rawMag = maxDist;
        }
        this.dx = rawDx;
        this.dy = rawDy;
        this.magnitude = rawMag;
    }
    handleEnd(touch) {
        if (touch.identifier === this.touchId) {
            this.active = false;
            this.touchId = null;
            this.dx = 0;
            this.dy = 0;
            this.magnitude = 0;
        }
    }
    draw(ctx) {
        ctx.save();
        let alpha = this.active ? 0.3 : 0.15;
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(this.baseX, this.baseY, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = alpha * 0.5;
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        if (this.active) {
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = '#00ffaa';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#00ffaa';
            ctx.beginPath();
            ctx.arc(this.baseX + this.dx, this.baseY + this.dy, 18, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
}

// Nuevos arrays para el sistema de drops
let grid = [], entities = [], rockets = [], particles = [], explosions = [], weaponDrops = [], keys = {}, leftJoystick = null, rightJoystick = null;
let player, cam = { x: 0, y: 0 }, currentLevel = 1, gameTime = 0;

/** * SISTEMA DE SEMILLAS Y PATRONES NEÓN (Original mantenido)
 */
function sfc32(seed) {
    let a = 0x9E3779B9, b = 0x243F6A88, c = 0xB7E15162, d = seed;
    return function() {
        a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
        var t = (a + b | 0) + d | 0;
        d = d + 1 | 0;
        a = b ^ b >>> 9;
        b = c + (c << 3) | 0;
        c = (c << 21 | c >>> 11);
        c = c + t | 0;
        return (t >>> 0) / 4294967296;
    }
}
let seededRandom = Math.random;

const hatchPattern = (() => {
    const p = document.createElement('canvas');
    p.width = 32; p.height = 32;
    const pctx = p.getContext('2d');
    pctx.fillStyle = '#050a05'; 
    pctx.fillRect(0, 0, 32, 32);
    pctx.strokeStyle = '#00ffaa'; 
    pctx.lineWidth = 2;
    pctx.beginPath();
    pctx.moveTo(0, 32); pctx.lineTo(32, 0);
    pctx.moveTo(-16, 16); pctx.lineTo(16, -16);
    pctx.moveTo(16, 48); pctx.lineTo(48, 16);
    pctx.stroke();
    pctx.strokeStyle = 'rgba(0, 255, 170, 0.3)';
    pctx.lineWidth = 6;
    pctx.stroke();
    return ctx.createPattern(p, 'repeat');
})();

// MAP GENERATION (Original mantenido)
function generateMap(level) {
    document.getElementById('lvl-txt').innerText = "NIVEL " + level;
    seededRandom = sfc32(level * 77777);

    const cols = Math.ceil(WORLD.width / WORLD.res);
    const rows = Math.ceil(WORLD.height / WORLD.res);
    
    grid = Array(cols).fill().map((_, x) => Array(rows).fill(0).map((_, y) => 
        (x <= 1 || x >= cols-2 || y <= 1 || y >= rows-2) ? 1 : (seededRandom() < WORLD.threshold ? 1 : 0)
    ));

    for(let i=0; i<6; i++) {
        let next = grid.map(arr => [...arr]);
        for(let x=1; x<cols-1; x++) {
            for(let y=1; y<rows-1; y++) {
                let n = 0;
                for(let ix=-1; ix<=1; ix++) for(let iy=-1; iy<=1; iy++) n += grid[x+ix][y+iy];
                if (n > 4) next[x][y] = 1; else if (n < 4) next[x][y] = 0;
            }
        }
        grid = next;
    }

    let startX = Math.floor(cols/2), startY = Math.floor(rows/2);
    while(grid[startX][startY] === 1 && startX < cols-2) startX++;

    let reachable = Array(cols).fill().map(() => Array(rows).fill(false));
    let stack = [[startX, startY]];
    if(grid[startX][startY] === 0) reachable[startX][startY] = true;

    while(stack.length > 0) {
        let [cx, cy] = stack.pop();
        [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx, dy]) => {
            let nx = cx + dx, ny = cy + dy;
            if(nx >= 0 && nx < cols && ny >= 0 && ny < rows && grid[nx][ny] === 0 && !reachable[nx][ny]) {
                reachable[nx][ny] = true;
                stack.push([nx, ny]);
            }
        });
    }

    for(let x=0; x<cols; x++) for(let y=0; y<rows; y++) if(!reachable[x][y]) grid[x][y] = 1;
}

// Partículas (Original mantenido)
class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        let angle = seededRandom() * Math.PI * 2;
        let speed = 2 + seededRandom() * 8;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 3;
        this.radius = 2 + seededRandom() * 4;
        this.life = 60 + seededRandom() * 60;
        this.maxLife = this.life;
    }
    update() {
        this.vy += PHYS.grav * 0.5 * dt;
        this.vx *= Math.pow(0.99, dt); this.vy *= Math.pow(0.99, dt);
        let nextX = this.x + this.vx * dt;
        let nextY = this.y + this.vy * dt;
        let gx = Math.floor(nextX / WORLD.res);
        let gy = Math.floor(nextY / WORLD.res);
        if(grid[gx] && grid[gx][gy] === 1) {
            this.vx *= -0.6;
            this.vy *= -0.6;
        } else {
            this.x = nextX; this.y = nextY;
        }
        this.life--;
    }
    draw(targetCtx) {
        targetCtx.globalAlpha = this.life / this.maxLife;
        targetCtx.fillStyle = this.color;
        targetCtx.beginPath(); targetCtx.arc(this.x, this.y, this.radius, 0, Math.PI*2); targetCtx.fill();
        targetCtx.globalAlpha = 1;
    }
}

// Explosión (Actualizada para soportar Nukes visuals)
class ExplosionEffect {
    constructor(x, y, radius, isNuke = false) {
        this.x = x; this.y = y;
        this.isNuke = isNuke;
        this.radius = 10;
        this.maxRadius = radius;
        this.duration = isNuke ? 60 : 15;
        this.life = this.duration;
    }
    update() {
        this.radius += (this.maxRadius - this.radius) * (this.isNuke ? 0.1 : 0.2);
        this.life--;
    }
    draw(targetCtx) {
        targetCtx.save();
        let pct = this.life / this.duration;
        targetCtx.shadowBlur = this.isNuke ? 100 * pct : 30;
        targetCtx.shadowColor = this.isNuke ? "#ff0000" : "#ffcc00";
        
        let r, g, b;
        if(this.isNuke) {
            r = 255; g = 50 + 150 * (1-pct); b = 0; // De rojo a naranja
        } else {
            r = 255; g = 200; b = 50;
        }

        targetCtx.fillStyle = `rgba(${r}, ${g}, ${b}, ${pct})`;
        targetCtx.beginPath();
        targetCtx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
        targetCtx.fill();
        targetCtx.restore();
    }
}

/**
 * === NUEVA CLASE: PAQUETE DE ARMA (DROP) ===
 */
class WeaponDrop {
    constructor(x, y, weaponType) {
        this.x = x; this.y = y;
        this.weaponType = weaponType;
        this.radius = 25;
        this.vy = -5 - seededRandom() * 5; // Salto inicial
        this.vx = (seededRandom() - 0.5) * 4;
        this.angle = 0;
    }

    update() {
        this.vy += PHYS.grav * 0.5 * dt;
        this.vx *= Math.pow(0.98, dt);
        
        // Movimiento y colisión simple
        let nextX = this.x + this.vx * dt;
        let nextY = this.y + this.vy * dt;
        let gx = Math.floor(nextX / WORLD.res);
        let gy = Math.floor(nextY / WORLD.res);

        if(grid[gx] && grid[gx][gy] === 1) {
            this.vy *= -0.5; // Rebote suave en el suelo
            this.vx *= 0.8;
            this.y = Math.floor(this.y/WORLD.res) * WORLD.res + this.radius; // Evitar atasco
        } else {
            this.x = nextX; this.y = nextY;
        }

        // Flotar visualmente
        this.angle += 0.05 * dt;
        this.drawYOffset = Math.sin(this.angle) * 5;

        // Colisión con el jugador
        if(Math.hypot(this.x - player.x, this.y - player.y) < this.radius + player.radius) {
            if (!player.collectedWeapons.includes(this.weaponType)) {
                player.collectedWeapons.push(this.weaponType);
            }
            player.weaponIndex = player.collectedWeapons.indexOf(this.weaponType);
            player.currentWeapon = this.weaponType;
            this.dead = true;
            // Efecto visual de recogida
            for(let i=0; i<10; i++) particles.push(new Particle(this.x, this.y, this.weaponType.color));
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y + this.drawYOffset);
        
        // Brillo exterior
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.weaponType.color;
        
        // Caja neón
        ctx.strokeStyle = this.weaponType.color;
        ctx.lineWidth = 3;
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.beginPath();
        ctx.rect(-this.radius, -this.radius, this.radius*2, this.radius*2);
        ctx.fill();
        ctx.stroke();
        
        // Texto del arma (ID)
        ctx.fillStyle = "#fff";
        ctx.font = "bold 20px 'Segoe UI'";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowBlur = 5;
        ctx.fillText(this.weaponType.id, 0, 0);
        
        ctx.restore();
    }
}

// Soldado (Actualizada para IA compleja, Arquetipos y Arsenal)
class Soldier {
    constructor(x, y, archetype, isPlayer = false) {
        this.x = x; this.y = y;
        this.isPlayer = isPlayer;
        this.vy = 0; this.vx = 0; this.jet = 100;
        this.lastShot = 0;
        this.targetEnemy = null;

        if(isPlayer) {
            this.archetype = { name: "Jugador", color: "#00ffaa" };
            this.color = "#00ffaa";
            this.hp = 100;
            this.radius = 20;
            this.currentWeapon = WEAPON_TYPES.MACHINEGUN; // Empezar con metralleta
            this.collectedWeapons = [WEAPON_TYPES.MACHINEGUN];
            this.weaponIndex = 0;
        } else {
            this.archetype = archetype;
            this.color = archetype.color;
            this.hp = archetype.hp;
            this.radius = 20 * archetype.scale;
            this.currentWeapon = archetype.weapon;
        }
    }

    update() {
        if(this.isPlayer) {
            if (isMobile && leftJoystick && leftJoystick.active) {
                let sensitivity = PLAYER_CFG.sensitivity;
                this.vx += (leftJoystick.dx / 50) * sensitivity * dt;
                this.vy += (leftJoystick.dy / 50) * sensitivity * 0.6 * dt;
                if (leftJoystick.dy < -20 && this.jet > 0) {
                    this.vy -= PLAYER_CFG.jetThrust * dt;
                    this.jet -= PLAYER_CFG.jetDrain * dt;
                } else {
                    this.jet = Math.min(100, this.jet + PLAYER_CFG.jetRecharge * dt);
                }
            } else {
                if(keys['KeyA']) this.vx -= PLAYER_CFG.moveSpeed * dt; if(keys['KeyD']) this.vx += PLAYER_CFG.moveSpeed * dt;
                if(keys['KeyW'] && this.jet > 0) { this.vy -= PLAYER_CFG.jetThrust * dt; this.jet -= PLAYER_CFG.jetDrain * dt; }
                else this.jet = Math.min(100, this.jet + PLAYER_CFG.jetRecharge * dt);
                if(keys['Space']) this.shoot();
            }
            if (isMobile && rightJoystick && rightJoystick.active) {
                this.shoot(rightJoystick.dx, rightJoystick.dy);
            }
            if(keys['KeyN']) { keys['KeyN'] = false; nextLevel(); }

            this.findNearestEnemy();
        } else {
            // IA enemiga por arquetipo
            if(player) {
                let dx = player.x - this.x, dy = player.y - this.y;
                let d = Math.hypot(dx, dy);
                
                // Rango de visión de la IA aumentado
                if(d < 1500) { 
                    this.vx += (dx > 0 ? ENEMY_CFG.moveSpeed : -ENEMY_CFG.moveSpeed) * dt;
                    if(dy < -50 && this.jet > 30) this.vy -= ENEMY_CFG.jetThrust * dt;
                    if(grid[Math.floor((this.x + this.vx*10)/WORLD.res)]?.[Math.floor(this.y/WORLD.res)] === 1 && this.jet > 50) this.vy -= ENEMY_CFG.wallJetThrust * dt;

                    // Lógica de disparo enemiga
                    let shootChance = 0.015;
                    let shootRange = 800;
                    
                    // Ajustes por arma enemiga
                    if(this.currentWeapon === WEAPON_TYPES.MG) { shootRange = 1000; shootChance = 0.1; }
                    if(this.currentWeapon === WEAPON_TYPES.SG) { shootRange = 500; shootChance = 0.03; }
                    if(this.currentWeapon === WEAPON_TYPES.NK) { shootRange = 1200; shootChance = 0.005; }

                    if(seededRandom() < shootChance && d < shootRange) this.shoot();
                }
            }
        }

        this.vy += PHYS.grav * dt;
        this.vx *= Math.pow(PHYS.frict, dt);

        // Sub-stepping (Original)
        for(let i=0; i<PHYS.steps; i++) {
            this.x += this.vx / PHYS.steps;
            this.resolveGridCollision('x');
            this.y += this.vy / PHYS.steps;
            this.resolveGridCollision('y');
        }
        
        if(this.hp <= 0) this.explodeIntoParticles();
    }

    // Original, adaptado para limpiar texto de objetivo si no hay
    findNearestEnemy() {
        let minXDist = Infinity;
        let oldTarget = this.targetEnemy;
        this.targetEnemy = null;
        entities.forEach(e => {
            if(!e.isPlayer) {
                let d = Math.hypot(e.x - this.x, e.y - this.y);
                if(d < minXDist && d < 1200) {
                    minXDist = d;
                    this.targetEnemy = e;
                }
            }
        });
        
        // Actualizar UI de objetivo
        let targetTxt = document.getElementById('targ-weap');
        if(this.targetEnemy) {
            targetTxt.innerText = `OBJETIVO (${this.targetEnemy.archetype.name}): ${this.targetEnemy.currentWeapon.name}`;
        } else {
            targetTxt.innerText = "";
        }
    }

    // Original
    resolveGridCollision(axis) {
        let left = Math.floor((this.x - this.radius) / WORLD.res);
        let right = Math.floor((this.x + this.radius) / WORLD.res);
        let top = Math.floor((this.y - this.radius) / WORLD.res);
        let bottom = Math.floor((this.y + this.radius) / WORLD.res);

        for (let x = left; x <= right; x++) {
            for (let y = top; y <= bottom; y++) {
                if (grid[x] && grid[x][y] === 1) {
                    if (axis === 'x') {
                        this.x = (this.vx > 0) ? x * WORLD.res - this.radius - 0.01 : (x + 1) * WORLD.res + this.radius + 0.01;
                        this.vx *= -PHYS.bounce;
                    } else {
                        this.y = (this.vy > 0) ? y * WORLD.res - this.radius - 0.01 : (y + 1) * WORLD.res + this.radius + 0.01;
                        this.vy *= -PHYS.bounce;
                    }
                    return;
                }
            }
        }
    }

    // Actualizada para el sistema de Arsenal multibalas
    shoot(aimDx, aimDy) {
        let w = this.currentWeapon;
        if(Date.now() - this.lastShot < w.cooldown) return;
        
        let tx, ty;
        if(this.isPlayer) {
            if (aimDx !== undefined && aimDy !== undefined) {
                tx = this.x + aimDx;
                ty = this.y + aimDy;
            } else if (this.targetEnemy) {
                tx = this.targetEnemy.x; ty = this.targetEnemy.y;
            } else {
                return;
            }
        } else {
            tx = player.x; ty = player.y;
        }

        let baseAngle = Math.atan2(ty - this.y, tx - this.x);

        for(let i=0; i < w.count; i++) {
            // Aplicar dispersión (spread)
            let angle = baseAngle + (seededRandom() - 0.5) * w.spread;
            rockets.push(new Rocket(this.x, this.y, angle, w, this));
        }

        // Efecto de retroceso visual
        let rec = w.expPush * 0.1;
        this.vx -= Math.cos(baseAngle) * rec;
        this.vy -= Math.sin(baseAngle) * rec;

        this.lastShot = Date.now();
    }

    cycleWeapon() {
        if (this.collectedWeapons.length <= 1) return;
        this.weaponIndex = (this.weaponIndex + 1) % this.collectedWeapons.length;
        this.currentWeapon = this.collectedWeapons[this.weaponIndex];
    }

    explodeIntoParticles() {
        // Drop de arma si es enemigo (50% de probabilidad)
        if(!this.isPlayer && seededRandom() < 0.5) {
            weaponDrops.push(new WeaponDrop(this.x, this.y, this.currentWeapon));
        }

        // Partículas (Original + escalado)
        let pCount = this.isPlayer ? 25 : 15 * this.archetype.scale;
        for(let i=0; i<pCount; i++) {
            particles.push(new Particle(this.x, this.y, this.color));
        }
        
        // Explosión visual (Original + escalado por arma)
        explosions.push(new ExplosionEffect(this.x, this.y, 130 * (this.isPlayer ? 1 : this.archetype.scale)));

        if(this.isPlayer) {
            this.currentWeapon = WEAPON_TYPES.MACHINEGUN;
            this.collectedWeapons = [WEAPON_TYPES.MACHINEGUN];
            this.weaponIndex = 0;
            this.hp = 100; this.respawn();
        } else {
            entities = entities.filter(e => e !== this);
        }
    }

    // Original
    respawn() {
        this.vx = 0; this.vy = 0;
        let found = false;
        while(!found) {
            let rx = Math.floor(seededRandom() * grid.length);
            let ry = Math.floor(seededRandom() * grid[0].length);
            if(grid[rx] && grid[rx][ry] === 0) {
                this.x = rx * WORLD.res + WORLD.res/2;
                this.y = ry * WORLD.res + WORLD.res/2;
                if(!this.isPlayer) this.hp = this.archetype.hp; // Reset HP enemigos
                found = true;
            }
        }
    }

    // Original + Nombre arquetipo
    draw() {
        if(this.isPlayer && this.targetEnemy) {
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 255, 170, 0.4)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00ffaa";
            ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.targetEnemy.x, this.targetEnemy.y); ctx.stroke();
            ctx.restore();
        }

        ctx.save();
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
        
        ctx.fillStyle = "#000";
        let angle = Math.atan2(this.vy, this.vx);
        ctx.beginPath(); ctx.arc(this.x + Math.cos(angle)*8, this.y + Math.sin(angle)*8, 4, 0, Math.PI*2); ctx.fill();
        
        // Dibujar nombre/arquetipo
        if(!this.isPlayer) {
            ctx.fillStyle = "#fff";
            ctx.font = "12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(this.archetype.name, this.x, this.y - this.radius - 5);
        }
        ctx.restore();
    }
}

// Proyectil (Actualizada para soportar múltiples tipos de armas)
class Rocket {
    constructor(x, y, angle, weaponType, owner) {
        this.x = x; this.y = y; this.owner = owner;
        this.w = weaponType;
        let s = this.w.speed;
        // Variación ligera de velocidad
        s *= (0.9 + seededRandom() * 0.2); 
        this.vx = Math.cos(angle) * s; 
        this.vy = Math.sin(angle) * s;
        this.dead = false;
        // Color del proyectil basado en el arma, no en el dueño
        this.color = this.w.color;
        this.birth = Date.now();
    }
    
    update() {
        this.x += this.vx * dt; this.y += this.vy * dt;
        
        // Humo visual para misiles pesados
        if(this.w.smoky && seededRandom() < 0.3) {
            particles.push(new Particle(this.x, this.y, "#555"));
        }

        let gx = Math.floor(this.x/WORLD.res), gy = Math.floor(this.y/WORLD.res);
        
        if(!grid[gx] || grid[gx][gy] === 1) {
            this.explode(this.x, this.y);
            return;
        }

        // Autodestrucción por tiempo (para balas de metralleta)
        if(this.w === WEAPON_TYPES.MG && Date.now() - this.birth > 1000) {
             this.explode(this.x, this.y); return;
        }

        entities.forEach(e => {
            if(e !== this.owner && Math.hypot(e.x-this.x, e.y-this.y) < e.radius) {
                this.explode(e.x, e.y);
            }
        });
    }

    explode(ex, ey) {
        if(this.dead) return;
        this.dead = true;
        
        // Efecto visual (Actualizado)
        explosions.push(new ExplosionEffect(ex, ey, this.w.expRad, this.w.nuke));

        // Mecanismo de daño (Original adaptado a variables del arma)
        entities.forEach(e => {
            let d = Math.hypot(e.x - ex, e.y - ey);
            if(d < this.w.expRad) { 
                let pct = (1 - d / this.w.expRad);
                e.hp -= pct * this.w.damage; 
                
                let ang = Math.atan2(e.y - ey, e.x - ex); 
                e.vx += Math.cos(ang) * pct * this.w.expPush; 
                e.vy += Math.sin(ang) * pct * this.w.expPush; 
            }
        });
    }

    draw() {
        ctx.save();
        ctx.fillStyle = "#fff";
        ctx.shadowBlur = this.w.nuke ? 20 : 10;
        ctx.shadowColor = this.color;
        
        // Tamaño visual de la bala
        let size = this.w.nuke ? 10 : (this.w === WEAPON_TYPES.MG ? 3 : 5);
        ctx.fillRect(this.x - size/2, this.y - size/2, size, size);
        ctx.restore();
    }
}

// Original + Drops
function drawWeaponIcon(ctx, weaponType, cx, cy, size) {
    ctx.save();
    ctx.strokeStyle = weaponType.color;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 8;
    ctx.shadowColor = weaponType.color;
    ctx.fillStyle = 'transparent';
    let s = size / 2;
    if (weaponType.id === 'MG') {
        ctx.beginPath();
        ctx.rect(cx - s * 0.5, cy - s * 0.3, s, s * 0.6);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx + s * 0.5, cy - s * 0.1);
        ctx.lineTo(cx + s, cy - s * 0.1);
        ctx.stroke();
        ctx.beginPath();
        ctx.rect(cx - s * 0.2, cy + s * 0.3, s * 0.3, s * 0.4);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx - s * 0.1, cy + s * 0.3);
        ctx.lineTo(cx - s * 0.1, cy + s * 0.7);
        ctx.stroke();
    } else if (weaponType.id === 'RK') {
        ctx.beginPath();
        ctx.moveTo(cx + s, cy);
        ctx.lineTo(cx - s * 0.3, cy - s * 0.3);
        ctx.lineTo(cx - s * 0.3, cy + s * 0.3);
        ctx.closePath();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx - s * 0.3, cy - s * 0.3);
        ctx.lineTo(cx - s, cy - s * 0.5);
        ctx.lineTo(cx - s * 0.5, cy);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx - s * 0.3, cy + s * 0.3);
        ctx.lineTo(cx - s, cy + s * 0.5);
        ctx.lineTo(cx - s * 0.5, cy);
        ctx.stroke();
    } else if (weaponType.id === 'SG') {
        ctx.beginPath();
        ctx.moveTo(cx - s, cy - s * 0.15);
        ctx.lineTo(cx + s * 0.6, cy - s * 0.15);
        ctx.lineTo(cx + s * 0.6, cy + s * 0.15);
        ctx.lineTo(cx - s, cy + s * 0.15);
        ctx.closePath();
        ctx.stroke();
        ctx.beginPath();
        ctx.rect(cx - s * 0.6, cy + s * 0.15, s * 0.3, s * 0.35);
        ctx.stroke();
        ctx.beginPath();
        ctx.rect(cx + s * 0.3, cy - s * 0.3, s * 0.3, s * 0.6);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx - s * 0.6, cy);
        ctx.lineTo(cx - s * 0.1, cy);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx + s * 0.3, cy + s * 0.15);
        ctx.lineTo(cx + s * 0.3, cy + s * 0.6);
        ctx.stroke();
    } else if (weaponType.id === 'NK') {
        ctx.beginPath();
        ctx.arc(cx, cy, s * 0.2, 0, Math.PI * 2);
        ctx.stroke();
        for (let i = 0; i < 3; i++) {
            let a = (i * 120 - 90) * Math.PI / 180;
            let outerR = s * 0.85;
            let innerR = s * 0.35;
            let half = 0.35;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a - half) * innerR, cy + Math.sin(a - half) * innerR);
            ctx.quadraticCurveTo(cx + Math.cos(a - half * 0.5) * innerR, cy + Math.sin(a - half * 0.5) * innerR, cx + Math.cos(a) * outerR, cy + Math.sin(a) * outerR);
            ctx.quadraticCurveTo(cx + Math.cos(a + half * 0.5) * innerR, cy + Math.sin(a + half * 0.5) * innerR, cx + Math.cos(a + half) * innerR, cy + Math.sin(a + half) * innerR);
            ctx.quadraticCurveTo(cx + Math.cos(a) * innerR * 0.4, cy + Math.sin(a) * innerR * 0.4, cx + Math.cos(a - half) * innerR, cy + Math.sin(a - half) * innerR);
            ctx.stroke();
        }
    }
    ctx.restore();
}

function drawMinimap() {
    mCtx.clearRect(0, 0, mCanvas.width, mCanvas.height);
    const cols = grid.length;
    const rows = grid[0].length;
    const scale = Math.min(mCanvas.width / (cols * WORLD.res), mCanvas.height / (rows * WORLD.res));
    
    mCtx.fillStyle = 'rgba(0, 255, 170, 0.3)';
    for(let x=0; x<cols; x++) {
        for(let y=0; y<rows; y++) {
            if(grid[x][y] === 1) {
                mCtx.fillRect(x * WORLD.res * scale, y * WORLD.res * scale, WORLD.res * scale, WORLD.res * scale);
            }
        }
    }

    // Paquetes en minimapa (puntos amarillos)
    weaponDrops.forEach(d => {
        mCtx.fillStyle = "#ffff00";
        mCtx.fillRect(d.x * scale - 2, d.y * scale - 2, 4, 4);
    });

    entities.forEach(e => {
        mCtx.fillStyle = e.isPlayer ? "#00ffaa" : "#ff4444";
        mCtx.beginPath(); mCtx.arc(e.x * scale, e.y * scale, 3 * (e.isPlayer?1:e.archetype.scale), 0, Math.PI*2); mCtx.fill();
    });

    mCtx.strokeStyle = "#fff";
    mCtx.lineWidth = 1;
    mCtx.strokeRect(cam.x * scale, cam.y * scale, canvas.width * scale, canvas.height * scale);
}

// Original + Limpieza de Drops
function nextLevel() {
    toggleSettings(false);
    currentLevel++;
    rockets = []; particles = []; explosions = []; weaponDrops = [];
    player.collectedWeapons = [WEAPON_TYPES.MACHINEGUN];
    player.weaponIndex = 0;
    player.currentWeapon = WEAPON_TYPES.MACHINEGUN;
    generateMap(currentLevel);
    initEntities(); // Re-inicializar enemigos
    startLevelIntro();
}

// Separada lógica de entidades para poder reiniciar el nivel
function initEntities() {
     if(!player) {
         player = new Soldier(0,0, null, true);
     }
     player.respawn();
     entities = [player];
     
     // Cantidad y dificultad de enemigos escalada por nivel
     let enemyCount = 3 + Math.floor(currentLevel * 1.5);
     for(let i=0; i < enemyCount; i++) {
        // Selección de arquetipo basada en probabilidad (más pesados en niveles altos)
        let roll = seededRandom() * (1 + currentLevel * 0.1);
        let arch;
        if(roll < 0.7) arch = ENEMY_ARCHETYPES[0]; // Recluta
        else if(roll < 1.2) arch = ENEMY_ARCHETYPES[2]; // Asaltante
        else if(roll < 1.6) arch = ENEMY_ARCHETYPES[1]; // Artillero
        else arch = ENEMY_ARCHETYPES[3]; // DEMOLEDOR

        let e = new Soldier(0,0, arch); 
        e.respawn(); 
        entities.push(e); 
    }
}

// Original adaptada
function startLevelIntro() {
    levelIntro = { level: currentLevel, start: performance.now() };
    document.getElementById('level-intro').style.display = 'flex';
    document.getElementById('intro-level').innerText = 'NIVEL ' + currentLevel;
}

function init() {
    mCanvas.width = isMobile ? 120 : 240;
    mCanvas.height = isMobile ? 90 : 180;
    generateMap(currentLevel);
    initEntities();
    if (isMobile) {
        leftJoystick = new VirtualJoystick(80, canvas.height - 80, 50);
        rightJoystick = new VirtualJoystick(canvas.width - 80, canvas.height - 80, 50);
        document.getElementById('mobile-hud').style.display = 'flex';
        document.querySelector('.ui').style.display = 'none';
    }
    startLevelIntro();
    buildSettings();
    document.getElementById('gear-icon').addEventListener('click', () => toggleSettings(true));
    document.getElementById('settings-close').addEventListener('click', () => toggleSettings(false));
    document.getElementById('settings-overlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) toggleSettings(false); });
}

function buildSettings() {
    const body = document.getElementById('settings-body');
    body.innerHTML = '';
    for (const sec of SETTINGS_CONFIG) {
        if (sec.isWeapons) {
            const ws = document.createElement('div');
            ws.className = 'set-section';
            ws.innerHTML = '<div class="set-section-title">WEAPONS</div>';
            for (const [wkey, w] of Object.entries(WEAPON_TYPES)) {
                const wdiv = document.createElement('div');
                wdiv.style.cssText = 'margin:6px 0;padding:4px 6px;border:1px solid #222;border-radius:6px;';
                wdiv.innerHTML = `<div style="color:${w.color};font-size:11px;font-weight:bold;margin-bottom:4px;">${w.name} (${w.id})</div>`;
                const fields = [
                    { label: 'Cooldown', prop: 'cooldown', def: w.cooldown, min: 10, max: 5000, step: 10 },
                    { label: 'Speed', prop: 'speed', def: w.speed, min: 1, max: 100, step: 1 },
                    { label: 'Damage', prop: 'damage', def: w.damage, min: 1, max: 2000, step: 1 },
                    { label: 'Spread', prop: 'spread', def: w.spread, min: 0, max: 1, step: 0.05 },
                ];
                if (w.count > 1) fields.push({ label: 'Pellets', prop: 'count', def: w.count, min: 1, max: 50, step: 1 });
                if (w.expRad > 15) fields.splice(3, 0, { label: 'Exp radius', prop: 'expRad', def: w.expRad, min: 5, max: 1000, step: 5 });
                for (const f of fields) {
                    const row = document.createElement('div');
                    row.className = 'set-row';
                    row.innerHTML = `
                        <span class="set-label" style="width:100px;">${f.label}</span>
                        <input class="set-input" type="number" step="${f.step}" min="${f.min}" max="${f.max}" value="${w[f.prop]}">
                        <span class="set-reset" title="Reset">&#x21BA;</span>
                    `;
                    const inp = row.querySelector('.set-input');
                    const rst = row.querySelector('.set-reset');
                    const orig = f.def;
                    inp.addEventListener('input', () => { w[f.prop] = parseFloat(inp.value); });
                    rst.addEventListener('click', () => { w[f.prop] = orig; inp.value = orig; });
                    wdiv.appendChild(row);
                }
                ws.appendChild(wdiv);
            }
            body.appendChild(ws);
            continue;
        }
        const div = document.createElement('div');
        div.className = 'set-section';
        div.innerHTML = `<div class="set-section-title">${sec.section}</div>`;
        for (const item of sec.items) {
            const row = document.createElement('div');
            row.className = 'set-row';
            const val = item.ref ? item.ref[0][item.ref[1]] : item.get();
            row.innerHTML = `
                <span class="set-label">${item.label}</span>
                <input class="set-input" id="${item.id}" type="number" step="${item.step}" min="${item.min}" max="${item.max}" value="${val}">
                <span class="set-reset" data-id="${item.id}" title="Reset">&#x21BA;</span>
            `;
            const inp = row.querySelector('.set-input');
            const rst = row.querySelector('.set-reset');
            inp.addEventListener('input', () => {
                const v = parseFloat(inp.value);
                if (item.ref) item.ref[0][item.ref[1]] = v;
                else item.set(v);
            });
            rst.addEventListener('click', () => {
                if (item.ref) item.ref[0][item.ref[1]] = item.def;
                else item.set(item.def);
                inp.value = item.def;
            });
            div.appendChild(row);
        }
        body.appendChild(div);
    }
}

function toggleSettings(open) {
    settingsOpen = open;
    document.getElementById('settings-overlay').style.display = open ? 'flex' : 'none';
}

function loop(timestamp) {
    gameTime++;
    fpsFrameCount++;
    if (timestamp - fpsLastTime > 500) {
        document.getElementById('fps').innerText = Math.round(fpsFrameCount / ((timestamp - fpsLastTime) / 1000)) + ' FPS';
        fpsFrameCount = 0;
        fpsLastTime = timestamp;
    }

    dt = Math.min((timestamp - lastTimestamp) / 16.667, 3) * SPEED;
    lastTimestamp = timestamp;

    if (levelIntro) {
        let elapsed = performance.now() - levelIntro.start;
        let secs = Math.ceil(3 - elapsed / 1000);
        if (secs >= 2) {
            document.getElementById('intro-countdown').innerText = `Ready in ${secs} seconds...`;
        } else if (secs >= 1) {
            document.getElementById('intro-countdown').innerText = 'Ready in 1 second...';
        }
        if (elapsed >= 3000) {
            levelIntro = null;
            document.getElementById('level-intro').style.display = 'none';
        }
    }
    
    let viewW = canvas.width / ZOOM;
    let viewH = canvas.height / ZOOM;

    // Original Camara
    cam.x += (player.x - viewW/2 - cam.x) * 0.1 * dt;
    cam.y += (player.y - viewH/2 - cam.y) * 0.1 * dt;
    cam.x = Math.max(0, Math.min(cam.x, WORLD.width - viewW));
    cam.y = Math.max(0, Math.min(cam.y, WORLD.height - viewH));

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.scale(ZOOM, ZOOM);
    ctx.translate(-cam.x - viewW/2, -cam.y - viewH/2);

    // 1. Rejilla Neón (Original)
    ctx.fillStyle = hatchPattern;
    ctx.strokeStyle = "#00ffaa"; ctx.lineWidth = 2;
    const cols = grid.length; const rows = grid[0].length;
    ctx.beginPath();
    for(let x=0; x<cols; x++) {
        for(let y=0; y<rows; y++) {
            if(grid[x][y] === 1) {
                let rx = x * WORLD.res, ry = y * WORLD.res;
                if(rx + WORLD.res > cam.x && rx < cam.x + viewW &&
                   ry + WORLD.res > cam.y && ry < cam.y + viewH) {
                    ctx.rect(rx, ry, WORLD.res, WORLD.res);
                }
            }
        }
    }
    ctx.fill();
    ctx.stroke();

    if (settingsOpen) {
        document.getElementById('settings-overlay').style.display = 'flex';
    }

    if (!levelIntro && !settingsOpen) {
        // 2. NUEVO: Actualizar y dibujar Drops de Armas
        weaponDrops = weaponDrops.filter(d => !d.dead);
        weaponDrops.forEach(d => { d.update(); d.draw(); });

        // 3. Cohetes (Original)
        rockets = rockets.filter(r => !r.dead);
        rockets.forEach(r => { r.update(); r.draw(); });

        // 4. Partículas (Original)
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => { p.update(); p.draw(ctx); });

        // 5. Explosiones (Original)
        explosions = explosions.filter(e => e.life > 0);
        explosions.forEach(e => { e.update(); e.draw(ctx); });

        // 6. Soldados (Original)
        entities.forEach(e => { e.update(); e.draw(); });
        
        // Condición de victoria de nivel (Original)
        if (entities.length == 1 && entities[0] === player) { nextLevel(); }
    } else {
        weaponDrops.forEach(d => { d.draw(); });
        rockets.forEach(r => { r.draw(); });
        particles.forEach(p => { p.draw(ctx); });
        explosions.forEach(e => { e.draw(ctx); });
        entities.forEach(e => { e.draw(); });
    }

    ctx.restore();
    
    if (isMobile && leftJoystick && rightJoystick) {
        leftJoystick.draw(ctx);
        rightJoystick.draw(ctx);
    }
    
    // UI (Actualizada con info de arma)
    document.getElementById('hp-f').style.width = Math.max(0, player.hp) + "%";
    document.getElementById('jet-f').style.width = Math.max(0, player.jet) + "%";
    
    let weapNm = document.getElementById('weap-nm');
    weapNm.innerText = player.currentWeapon.name;
    weapNm.style.color = player.currentWeapon.color;
    weapNm.style.textShadow = `0 0 5px ${player.currentWeapon.color}`;
    
    if (isMobile) {
        document.getElementById('mobile-hp-fill').style.width = Math.max(0, player.hp) + "%";
        document.getElementById('mobile-jet-fill').style.width = Math.max(0, player.jet) + "%";
        let iconCtx = document.getElementById('weapon-icon-canvas').getContext('2d');
        iconCtx.clearRect(0, 0, 36, 36);
        drawWeaponIcon(iconCtx, player.currentWeapon, 18, 18, 36);
    }
    
    drawMinimap();
    requestAnimationFrame(loop);
}

// Original
window.onkeydown = e => { keys[e.code] = true; if (e.code === 'Escape') toggleSettings(false); };
window.onkeyup = e => keys[e.code] = false;
if (isMobile) {
    canvas.ontouchstart = (e) => {
        e.preventDefault();
        for (let t of e.changedTouches) {
            if (!leftJoystick.active && leftJoystick.handleStart(t)) continue;
            if (!rightJoystick.active && rightJoystick.handleStart(t)) continue;
        }
    };
    canvas.ontouchmove = (e) => {
        e.preventDefault();
        for (let t of e.changedTouches) {
            leftJoystick.handleMove(t);
            rightJoystick.handleMove(t);
        }
    };
    canvas.ontouchend = (e) => {
        e.preventDefault();
        for (let t of e.changedTouches) {
            leftJoystick.handleEnd(t);
            rightJoystick.handleEnd(t);
        }
    };
    canvas.ontouchcancel = canvas.ontouchend;
    let lastCycle = 0;
    document.getElementById('mobile-cycle-btn').addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        let now = Date.now();
        if (now - lastCycle < 300) return;
        lastCycle = now;
        player.cycleWeapon();
    });
    document.getElementById('mobile-cycle-btn').addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        let now = Date.now();
        if (now - lastCycle < 300) return;
        lastCycle = now;
        player.cycleWeapon();
    });
}

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    if (isMobile && rightJoystick) {
        rightJoystick.baseX = canvas.width - 80;
        rightJoystick.baseY = canvas.height - 80;
    }
    if (isMobile && leftJoystick) {
        leftJoystick.baseY = canvas.height - 80;
    }
});

init(); 
requestAnimationFrame(loop);
</script>
